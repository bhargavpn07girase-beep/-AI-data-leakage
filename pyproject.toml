[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-data-leakage-monitor"
version = "0.1.0"
description = "A local, directory-scoped data leakage monitoring prototype"
requires-python = ">=3.10"
dependencies = [
    "watchdog>=6.0,<7.0",
    "scikit-learn>=1.5,<2.0",
    "streamlit>=1.39,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]